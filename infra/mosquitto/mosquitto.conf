# Phase 1 development broker. Anonymous access is acceptable only because the
# testbed is isolated; Phase 6 (RO4) replaces this with authenticated,
# PQC-protected transport. Do not reuse this file outside the testbed.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type notice
